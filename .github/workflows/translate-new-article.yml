name: Update blog translations

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: "翻訳または更新確認する記事URL（空欄ならサイトマップを監視）"
        required: false
        type: string
      force_retranslate:
        description: "差分を無視して全文を再翻訳する（URLが空欄の場合は全記事）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: blog-auto-translation
  cancel-in-progress: false

defaults:
  run:
    # The Windows runner service may run under an account with script execution
    # disabled. Limit Bypass to the temporary script generated for this job.
    shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

jobs:
  translate:
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Trust runner workspace
        run: git config --global --add safe.directory "$env:GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Translate articles
        id: translate
        continue-on-error: true
        run: node scripts/translate-new-article.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          ARTICLE_URL: ${{ inputs.article_url }}
          FORCE_RETRANSLATE: ${{ inputs.force_retranslate }}

      - name: Update article status
        id: status
        if: always()
        continue-on-error: true
        run: node status/generate-article-status.mjs

      - name: Commit completed translations
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/
          git add status/articles.json
          if (Test-Path ".translation-monitor.json") {
            git add .translation-monitor.json
          }
          $changes = git status --porcelain
          if ($changes) {
            Write-Host "Commit candidates:"
            $changes | ForEach-Object { Write-Host $_ }
            git commit -m "Update blog translations"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "No changes to commit."
          }

      - name: Report translation failure
        if: steps.translate.outcome == 'failure' || steps.status.outcome == 'failure'
        run: |
          if ("${{ steps.translate.outcome }}" -eq "failure") {
            Write-Error "Translation failed after completed articles were saved."
          }
          if ("${{ steps.status.outcome }}" -eq "failure") {
            Write-Error "Status update failed."
          }
          exit 1
