name: Update blog translations

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: "翻訳または更新確認する記事URL（空欄ならサイトマップを監視）"
        required: false
        type: string
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: blog-auto-translation
  cancel-in-progress: false

jobs:
  translate:
    runs-on: [self-hosted, windows, x64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/translate-new-article.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          ARTICLE_URL: ${{ inputs.article_url }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/
          if (Test-Path ".translation-monitor.json") {
            git add .translation-monitor.json
          }
          $changes = git status --porcelain
          if ($changes) {
            Write-Host "コミット対象:"
            $changes | ForEach-Object { Write-Host $_ }
            git commit -m "Update blog translations"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "コミット対象の変更はありません。"
          }
