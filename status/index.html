<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog Translation Status</title>
  <style>
    :root { color-scheme: light; font-family: Arial, "Meiryo", sans-serif; }
    body { margin: 24px; padding-bottom: 84px; color: #222; background: #f6f8fa; }
    main { max-width: 1100px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .summary { margin: 0 0 16px; color: #57606a; }
    .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    #search { width: min(360px, 100%); padding: 7px 9px; border: 1px solid #d0d7de; border-radius: 6px; font: inherit; }
    .filter-toggle { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .filter-toggle input { width: 16px; height: 16px; margin: 0; }
    .status { margin-left: auto; color: #57606a; font-size: 13px; }
    .table-wrap { overflow-x: auto; background: #fff; border: 1px solid #d0d7de; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; min-width: 720px; table-layout: fixed; }
    th, td { padding: 9px 10px; border-bottom: 1px solid #d8dee4; text-align: left; vertical-align: middle; }
    th { position: sticky; top: 0; background: #f6f8fa; font-size: 13px; white-space: nowrap; }
    td.done { color: #1a7f37; font-family: "Arial Unicode MS", Arial, sans-serif; font-size: 22px; font-weight: bold; line-height: 1; text-align: center; }
    td.edit { white-space: nowrap; }
    td.translate { text-align: center; }
    .translate-check { width: 16px; height: 16px; margin: 0; accent-color: #1f883d; cursor: pointer; }
    .translation-actions { position: fixed; left: 24px; bottom: 20px; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #d0d7de; border-radius: 8px; background: rgba(255, 255, 255, .96); box-shadow: 0 3px 12px rgba(31, 35, 40, .18); }
    #translate-selected { padding: 7px 12px; border: 1px solid #1f883d; border-radius: 6px; color: #fff; background: #1f883d; font: inherit; cursor: pointer; }
    #translate-selected:hover:not(:disabled) { background: #1a7f37; }
    #translate-selected:disabled { border-color: #8c959f; background: #8c959f; cursor: default; }
    #selected-count { color: #57606a; font-size: 13px; white-space: nowrap; }
    td.id { white-space: nowrap; }
    td.title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.updated { white-space: nowrap; }
    tr.untranslated { background: #fffdf2; }
    tr:last-child td { border-bottom: 0; }
    a { color: #0969da; }
    .error { color: #cf222e; font-weight: bold; }
    @media (max-width: 600px) { body { margin: 12px; padding-bottom: 76px; } .toolbar { align-items: stretch; flex-direction: column; } .status { margin-left: 0; } .translation-actions { left: 12px; bottom: 12px; } }
  </style>
</head>
<body>
  <main>
    <h1>Blog Translation Status</h1>
    <p class="summary" id="summary">一覧を読み込んでいます。</p>
    <div class="toolbar">
      <input id="search" type="search" placeholder="記事名またはIDで絞り込み" autocomplete="off">
      <label class="filter-toggle"><input id="only-untranslated" type="checkbox"> 未翻訳のみ</label>
      <span class="status" id="status"></span>
    </div>
    <div class="table-wrap">
      <table>
        <colgroup>
          <col style="width: 48px">
          <col style="width: 52px">
          <col style="width: 58px">
          <col style="width: 160px">
          <col>
          <col style="width: 190px">
        </colgroup>
        <thead><tr><th>翻訳</th><th>英訳</th><th>編集</th><th>記事</th><th>記事名</th><th>更新日</th></tr></thead>
        <tbody id="articles"></tbody>
      </table>
    </div>
  </main>
  <div class="translation-actions" aria-live="polite">
    <button id="translate-selected" type="button" disabled>選択した記事を英訳</button>
    <span id="selected-count">0 件選択</span>
  </div>
  <script>
    "use strict";

    const state = { articles: [], generatedAt: null };
    const table = document.getElementById("articles");
    const summary = document.getElementById("summary");
    const status = document.getElementById("status");
    const search = document.getElementById("search");
    const onlyUntranslated = document.getElementById("only-untranslated");
    const translateSelected = document.getElementById("translate-selected");
    const selectedCount = document.getElementById("selected-count");
    const translationLauncherOrigin = "https://blog-translation-launcher.newrpg2012.workers.dev";
    const selectedArticleIds = new Set();

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.valueOf())) return value || "—";
      const parts = new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
      }).formatToParts(date).reduce((result, part) => {
        result[part.type] = part.value;
        return result;
      }, {});
      return `${parts.year}/${parts.month}/${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`;
    }

    function addLink(cell, href, label) {
      const link = document.createElement("a");
      link.href = href;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = label;
      cell.append(link);
    }

    function updateSelectionUi() {
      const count = selectedArticleIds.size;
      selectedCount.textContent = `${count} 件選択`;
      translateSelected.disabled = count === 0;
      translateSelected.textContent = count > 0
        ? `選択した ${count} 件を英訳`
        : "選択した記事を英訳";
    }

    function startTranslations(articles) {
      if (articles.length === 0) return;
      const url = new URL("/start", translationLauncherOrigin);
      for (const article of articles) {
        url.searchParams.append("article_url", article.url);
      }
      const popup = window.open(
        url.href,
        "nrp-translation-launcher",
        "popup=yes,width=520,height=260"
      );
      status.textContent = popup
        ? `${articles.length} 件の英訳を開始しています。GitHub認証が必要な場合は、開いた画面で完了してください。`
        : "ポップアップがブロックされました。ブラウザの許可後にもう一度押してください。";
    }

    window.addEventListener("message", event => {
      if (event.origin !== translationLauncherOrigin) return;
      if (event.data?.type !== "nrp-translation-dispatched") return;
      const count = Array.isArray(event.data.articleUrls)
        ? event.data.articleUrls.length
        : 1;
      selectedArticleIds.clear();
      render();
      status.textContent = `${count} 件の英訳を開始しました。GitHub Actionsの完了後に一覧を再読み込みしてください。`;
    });

    function render() {
      const keyword = search.value.trim().toLocaleLowerCase("ja-JP");
      const articles = state.articles.filter(article => {
        if (onlyUntranslated.checked && article.translated) return false;
        return !keyword || `${article.title} ${article.id}`.toLocaleLowerCase("ja-JP").includes(keyword);
      });
      table.replaceChildren();
      for (const article of articles) {
        const row = document.createElement("tr");
        if (!article.translated) row.className = "untranslated";

        const translated = document.createElement("td");
        translated.className = "done";
        translated.textContent = article.translated ? "○" : "";
        row.append(translated);

        const translate = document.createElement("td");
        translate.className = "translate";
        const translateCheck = document.createElement("input");
        translateCheck.type = "checkbox";
        translateCheck.className = "translate-check";
        translateCheck.checked = selectedArticleIds.has(article.id);
        translateCheck.title = "一括英訳する記事として選択";
        translateCheck.setAttribute("aria-label", `${article.id}.html を英訳対象として選択`);
        translateCheck.addEventListener("change", () => {
          if (translateCheck.checked) selectedArticleIds.add(article.id);
          else selectedArticleIds.delete(article.id);
          updateSelectionUi();
        });
        translate.append(translateCheck);
        row.append(translate);

        const edit = document.createElement("td");
        edit.className = "edit";
        addLink(edit, `https://blog.seesaa.jp/cms/article/edit/input?id=${encodeURIComponent(article.id)}`, "編集");
        row.append(edit);

        const articleLink = document.createElement("td");
        articleLink.className = "id";
        addLink(articleLink, article.url, `${article.id}.html`);
        row.append(articleLink);

        const title = document.createElement("td");
        title.className = "title";
        title.textContent = article.title || "—";
        row.append(title);

        const updated = document.createElement("td");
        updated.className = "updated";
        updated.textContent = formatDate(article.updatedAt);
        row.append(updated);
        table.append(row);
      }
      status.textContent = `${articles.length} / ${state.articles.length} 件`;
      updateSelectionUi();
    }

    async function initialize() {
      try {
        const response = await fetch("./articles.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        state.articles = Array.isArray(data.articles) ? data.articles : [];
        state.generatedAt = data.generatedAt || null;
        const translated = state.articles.filter(article => article.translated).length;
        summary.textContent = `全 ${state.articles.length} 件 / 翻訳済み ${translated} 件 / 一覧生成: ${formatDate(state.generatedAt)}`;
        render();
      } catch (error) {
        summary.innerHTML = '<span class="error">一覧データを読み込めませんでした。</span>';
        status.textContent = String(error.message || error);
      }
    }

    search.addEventListener("input", render);
    onlyUntranslated.addEventListener("change", render);
    translateSelected.addEventListener("click", () => {
      const articles = state.articles.filter(article => selectedArticleIds.has(article.id));
      startTranslations(articles);
    });
    initialize();
  </script>
</body>
</html>
